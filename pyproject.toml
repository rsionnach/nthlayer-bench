[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nthlayer-bench"
version = "1.7.4"
description = "NthLayer Bench — Tier 3 operator TUI for case management and situation awareness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Floor is the version this repo is built and tested against, NOT the
    # oldest one that happens to import. Guarded by
    # tests/test_dependency_declarations.py and
    # tests/smoke/test_resolved_dependencies.py; see CLAUDE.md hard rule 11
    # for why both are needed [opensrm-p3bm].
    # WHY 5.2.0 (opensrm-g35i): the version this repo is now built and tested
    # against (rule 10: the floor is the installed sibling). Nothing here uses
    # an API new in 5.1/5.2.
    "nthlayer-common>=5.2.0,<6.0.0",
    "textual>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    # Imported directly by the two dependency guards, so declared rather than
    # leaned on as pytest's transitive dep [opensrm-p3bm].
    "packaging>=22",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
]

[project.scripts]
nthlayer-bench = "nthlayer_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.uv.sources]
nthlayer-common = { path = "../nthlayer-common", editable = true }
